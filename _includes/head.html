<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="baseurl" content="{{ site.baseurl }}">
  
  {% seo %}

  <!-- Keep font styles parallel with the site stylesheet; CSS @import would
       serialize these requests on the critical rendering path. -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://use.typekit.net">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Inter:400,700&display=swap">
  <link rel="stylesheet" href="https://use.typekit.net/hoj2yet.css">
  <link rel="stylesheet" href="{{ '/assets/main.css' | relative_url }}">
  <link rel="canonical" href="{{ page.url | replace:'index.html','' | absolute_url }}">
  <link rel="icon" href="{{ '/favicon.svg' | relative_url }}" type="image/svg+xml">
  
  <!-- Preconnect to CDN for performance -->
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
  
  <!-- Load theme script first (sets initial theme before paint) -->
  <script data-cfasync="false">
    // Set initial dark theme immediately to prevent flash
    const savedTheme = localStorage.getItem('theme') || 'dark';
    document.documentElement.setAttribute('data-theme', savedTheme);
  </script>
  
  <!-- Load app.js BEFORE Alpine.js so components are registered -->
  <script data-cfasync="false" src="{{ '/assets/js/theme.js' | relative_url }}" defer></script>
  <script data-cfasync="false" src="{{ '/assets/js/app.js' | relative_url }}" defer></script>
  
  <!-- Alpine.js must load AFTER app.js -->
  <script
    data-cfasync="false"
    defer
    src="https://cdn.jsdelivr.net/npm/alpinejs@3.16.3/dist/cdn.min.js"
    integrity="sha384-GWGIn3FlbC6EIhIhKi0GSHWq/UCqPc7qpVE5J/bsAW8FMyMAyA08W86xYxy+8i5/"
    crossorigin="anonymous"></script>
  
  {% feed_meta %}
</head>
