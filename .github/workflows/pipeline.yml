name: Data Pipeline

on:
  schedule:
    # Run daily at 2 AM UTC to catch main report before it's overwritten
    - cron: '0 2 * * *'
  
  workflow_dispatch:  # Allow manual trigger

  pull_request:
    branches: ["main"]
    paths:
      - 'scripts/**'
      - 'requirements.txt'
      - '.github/workflows/pipeline.yml'
  
  push:
    branches: ["main"]
    paths:
      - 'scripts/**'
      - 'requirements.txt'
      - '.github/workflows/pipeline.yml'

# Keep workflow alive - GitHub disables scheduled workflows after 60 days of inactivity
# This workflow self-commits to data/ which triggers pages.yml rebuild

permissions:
  contents: write  # Needed to commit data files

concurrency:
  group: data-pipeline-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  fetch-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      
      - name: Setup Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
      
      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Run unit tests
        run: |
          pytest -q scripts/tests
          node --test scripts/tests/cloudflare_config.test.mjs
      
      - name: Run data pipeline
        if: github.event_name != 'pull_request'
        env:
          ABQ_PDF_BASE_URL: ${{ secrets.ABQ_PDF_BASE_URL }}
        run: |
          echo "Running data pipeline..."
          python scripts/build_dataset.py --validate
      
      - name: Check for changes
        if: github.event_name != 'pull_request'
        id: check_changes
        run: |
          git add data/
          if git diff --cached --quiet; then
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
          else
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
            echo "Changed files:"
            git diff --cached --stat
          fi
      
      - name: Commit and push changes
        if: github.event_name != 'pull_request' && steps.check_changes.outputs.has_changes == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -m "Update violations data - $(date -u '+%Y-%m-%d %H:%M UTC')"
          git push
      
      - name: No changes detected
        if: github.event_name != 'pull_request' && steps.check_changes.outputs.has_changes == 'false'
        run: |
          echo "No changes detected in violations data"
      
      - name: Upload artifacts
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: violations-data
          path: |
            data/violations_latest.json
            data/manifest.json
            data/snapshots/*.json
          retention-days: 30
